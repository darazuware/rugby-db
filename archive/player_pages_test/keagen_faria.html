<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>キーガン ・ファリア (Keagen Faria) | RugbyPick Player Profile</title>
    <style>
        :root {
            --primary: #c8102e;
            --secondary: #000;
            --light: #f4f4f4;
            --white: #fff;
            --text: #333;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.6;
            margin: 0;
            background-color: var(--light);
            color: var(--text);
        }

        .container {
            max-width: 900px;
            margin: 20px auto;
            padding: 20px;
        }

        header {
            background-color: var(--secondary);
            color: var(--white);
            padding: 30px 20px;
            border-radius: 12px 12px 0 0;
            text-align: center;
        }

        h1 {
            margin: 0;
            font-size: 2.5rem;
        }

        .eng-name {
            font-size: 1.2rem;
            opacity: 0.8;
        }

        .main-card {
            background: var(--white);
            padding: 30px;
            border-radius: 0 0 12px 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .section-title {
            grid-column: 1 / -1;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 8px;
            margin-top: 20px;
            font-size: 1.3rem;
            color: var(--primary);
            font-weight: bold;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }

        .info-label {
            font-weight: bold;
            color: #666;
        }

        .career-path {
            grid-column: 1 / -1;
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            font-size: 1.1rem;
            line-height: 1.8;
            color: var(--secondary);
        }

        .links {
            grid-column: 1 / -1;
            margin-top: 20px;
            text-align: center;
        }

        .btn {
            display: inline-block;
            background: var(--primary);
            color: var(--white);
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.8;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>キーガン ・ファリア</h1>
            <div class="eng-name">Keagen Faria</div>
        </header>

        <main class="main-card">
            <div class="section-title">基本情報 / Profile</div>
            <div class="info-item"><span class="info-label">ポジション</span><span>WTB</span></div>
            <div class="info-item"><span class="info-label">所属チーム</span><span>NECグリーンロケッツ東葛（2025-26）</span></div>
            <div class="info-item"><span class="info-label">生年月日</span><span>1994.12.10 (31歳)</span></div>
            <div class="info-item"><span class="info-label">身長 / 体重</span><span>185 cm / 90 kg</span></div>
            <div class="info-item"><span class="info-label">出身校</span><span>St.John’sCollage</span></div>
            <div class="info-item"><span class="info-label">リーグワン通算</span><span>38 キャップ</span></div>

            <div class="section-title">キャリア遍歴 / Career Path</div>
            <div class="career-path">
                Green Rockets Tokatsu (2024 - 2026) -> Shizuoka Blue Revs (2021 - 2024)
            </div>

            <div class="links">
                <a href="https://league-one.jp/player/483547" class="btn" target="_blank">League One 公式プロフィール</a>
            </div>
        </main>
    </div>
</body>

</html>

name: Scheduled Publish

# 予約公開の検知と Telegram 報告。
# 記事 frontmatter の publishAt（無ければ pubDate の JST 0:00）で公開判定し、
# 公開時刻を跨いだ記事を「公開完了」として Telegram に通知する。
# 状態ファイル data/master/_meta/publish_state.json が更新された時だけ commit/push し、
# その push が Vercel 再ビルドを起こして prerender ページ（/news/<slug>/）を生成する。
on:
  # 定期実行は停止中（手動実行のみ）
  workflow_dispatch:
    inputs:
      daily:
        description: '本日/明日の予定サマリを強制送信'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: write

# daily_update / monitor_news の push と競合しないよう直列化する。
concurrency:
  group: content-push
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine daily flag
        id: flag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "daily=${{ inputs.daily }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 22 * * *" ]; then
            echo "daily=true" >> "$GITHUB_OUTPUT"
          else
            echo "daily=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect & report scheduled publishes
        run: |
          if [ "${{ steps.flag.outputs.daily }}" = "true" ]; then
            python3 -m pipeline.publish_report --daily
          else
            python3 -m pipeline.publish_report
          fi

      - name: Commit state (triggers Vercel rebuild for newly-live articles)
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/master/_meta/publish_state.json
          if git diff --cached --quiet; then
            echo "公開状態に変化なし。コミットしない。"
          else
            git commit -m "chore: scheduled_publish $(date -u -d '+9 hours' +'%Y-%m-%d %H:%M JST')"
            git pull --rebase --autostash
            git push
          fi

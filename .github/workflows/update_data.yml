name: Update Rugby Data

on:
  schedule:
    # JST: 14:30, 16:30, 18:30, 20:30, 22:30, 00:30 on Sat/Sun (UTC: 5:30, 7:30, 9:30, 11:30, 13:30, 15:30)
    - cron: '30 5,7,9,11,13,15 * * 6,0'
    # JST: 06:00, 12:00, 18:00 on Mon-Fri (UTC: 21:00 previous day, 3:00, 9:00)
    - cron: '0 21,3,9 * * 0-4'
  workflow_dispatch: # 手動実行用

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4
          
      - name: Scrape Match Results
        run: |
          python3 scripts/scrape_leagueone_results.py
          python3 scripts/scrape_sr_results.py
          python3 scripts/scrape_top14_results.py
          
      - name: Scrape Standings
        run: python3 scripts/scrape_standings.py
        
      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/*.json
          git commit -m "Automated data update: $(date +'%Y-%m-%d %H:%M JST')" || exit 0
          git push

name: Update Rugby Data

on:
  schedule:
    # JST 16:00, 19:00, 22:00 on Sat/Sun
    - cron: '0 7,10,13 * * 6,0'
    # JST 09:00 on Monday (Weekly Cleanup)
    - cron: '0 0 * * 1'
  workflow_dispatch: # 手動実行用

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4
          
      - name: Scrape Match Results
        run: |
          python3 scripts/scrape_leagueone_results.py
          python3 scripts/scrape_sr_results.py
          python3 scripts/scrape_top14_results.py
          
      - name: Scrape Standings
        run: python3 scripts/scrape_standings.py
        
      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/*.json
          git commit -m "Automated data update: $(date +'%Y-%m-%d %H:%M JST')" || exit 0
          git push

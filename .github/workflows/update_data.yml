name: Update Rugby Data

on:
  # scrape_and_deploy.yml に移行済み。手動実行のみ残す
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4
          
      - name: Scrape Match Results
        run: |
          python3 scripts/scrape_leagueone_results.py
          python3 scripts/scrape_sr_results.py
          python3 scripts/scrape_top14_results.py
          
      - name: Scrape Standings
        run: python3 scripts/scrape_standings.py
        
      - name: Commit and Push changes
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/*.json
          git commit -m "Automated data update: $(date +'%Y-%m-%d %H:%M JST')" || exit 0
          git push
